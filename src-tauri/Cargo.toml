[package]
name = "norton-mac"
version = "1.0.0"
description = "Norton Commander classic dual-pane file manager for macOS"
authors = ["mariosalvucci"]
edition = "2021"

[lib]
name = "norton_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "NortonMac"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
dirs = "5.0"
sysinfo = "0.33"
trash = "5.2"
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
tar = "0.4"
flate2 = "1.0"
bzip2 = "0.4"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
openssl = { version = "0.10", features = ["vendored"] }
suppaftp = { version = "12.2", features = ["native-tls", "deprecated"] }
open = "5.3"
walkdir = "2.5"
libc = "0.2"
base64 = "0.22"

[profile.release]
panic = "abort"
opt-level = 3
strip = true
